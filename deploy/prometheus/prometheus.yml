global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: api
    static_configs:
      - targets: [api:8000]
  - job_name: workers
    static_configs:
      - targets: [worker-metrics:9101]
  - job_name: llm-stub
    static_configs:
      - targets: [llm-stub:8001]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  - job_name: jaeger
    static_configs:
      - targets: [jaeger:8888]
